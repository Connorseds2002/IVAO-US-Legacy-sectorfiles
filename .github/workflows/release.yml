name: Release sector files

# Builds one zip per ARTCC/FIR plus a full US zip (US-ALL.zip) and publishes
# them as a GitHub release when sector data under Include/ changes on main
# (i.e. when an AIRAC PR is merged). Changes to .isc profiles, scripts or this
# workflow alone do not publish a release; they ship with the next AIRAC
# release, or run this by hand from the Actions tab to release sooner.
on:
  push:
    branches: [main]
    paths:
      - "Include/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build zips
        id: build
        run: python3 .github/scripts/build_release.py dist >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE: ${{ steps.build.outputs.cycle }}
        run: |
          date=$(date -u +%Y-%m-%d)
          tag="airac-${CYCLE}-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "AIRAC ${CYCLE} – US sector files (${date})" \
            --notes-file dist/release_notes.md \
            --latest
