name: Release sector files

# Builds one zip per ARTCC/FIR plus a full US zip (US-ALL.zip) and publishes
# them as a GitHub release when sector data or profiles change on main.
# Workflow/README-only changes don't release. Can also be run from the Actions tab.
#
# The AIRAC number comes from AIRAC.txt. The first release for a cycle is
# "AIRAC 2612 – US sector files (date)" (tag airac-2612); later releases for
# the same cycle add " v2", " v3"... (tags airac-2612-v2, airac-2612-v3...).
on:
  push:
    branches: [main]
    paths:
      - "Include/**"
      - "*.isc"
      - "AIRAC.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.publish.outputs.title }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build zips
        id: build
        run: python3 .github/scripts/build_release.py dist >> "$GITHUB_OUTPUT"

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE: ${{ steps.build.outputs.cycle }}
        run: |
          date=$(date -u +%Y-%m-%d)
          # Count earlier releases for this cycle (airac-2612, airac-2612-v2, airac-2612-r1...)
          n=$(gh release list --limit 1000 --json tagName --jq \
                "[.[].tagName | select(test(\"^airac-${CYCLE}(-.*)?$\"))] | length")
          if [ "$n" -eq 0 ]; then
            tag="airac-${CYCLE}"; suffix=""
          else
            v=$((n + 1))
            while gh release view "airac-${CYCLE}-v${v}" >/dev/null 2>&1; do v=$((v + 1)); done
            tag="airac-${CYCLE}-v${v}"; suffix=" v${v}"
          fi
          title="AIRAC ${CYCLE} – US sector files (${date})${suffix}"
          gh release create "$tag" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file dist/release_notes.md \
            --latest
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "url=$(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_OUTPUT"

  # Runs only after the release job finished successfully.
  notify:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          TITLE: ${{ needs.release.outputs.title }}
          URL: ${{ needs.release.outputs.url }}
        run: |
          # DISCORD_WEBHOOKS secret: one line per webhook, "<webhook url> [user id to ping]"
          while read -r hook user; do
            [ -n "$hook" ] || continue
            # allowed_mentions: ping only the listed user, never @everyone/@here/roles
            jq -n --arg t "$TITLE" --arg u "$URL" --arg id "$user" '{
                username: "Legacy Sector Files",
                avatar_url: "https://github.com/Connorseds2002.png",
                content: ((if $id == "" then "" else "<@\($id)> " end) + "\($t) released: \($u)"),
                allowed_mentions: {parse: [], users: (if $id == "" then [] else [$id] end)}
              }' |
              curl -fsS -H "Content-Type: application/json" -d @- "$hook" \
              || echo "::warning::A Discord webhook post failed"
          done <<< "$WEBHOOKS"
